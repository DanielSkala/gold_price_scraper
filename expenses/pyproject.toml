[project]
name = "expenses-dashboard"
version = "1.0.0"
description = "A local-first Flask dashboard that turns bank CSV exports into spending analytics."
readme = "README.md"
requires-python = ">=3.9"

# Runtime dependencies for THIS app only. Plotly and Font Awesome are loaded from a
# CDN in the browser (not pip); Werkzeug comes in via Flask.
dependencies = [
    # Core web app (required)
    "flask>=2.0",
    "flask-cors>=3.0",
    # CSV parsing / tables (required)
    "tabulate>=0.9",
    # Gold tab — live spot prices + premium math (optional feature; needs network)
    "pandas>=1.3",
    "yfinance>=0.2",
    # macOS Photos "memories" (optional, macOS-only) — Pillow does dedup; absent = still works
    "pillow>=9.0",
]

[tool.uv]
# Keep the venv inside the project so `uv run` / `uv sync` are self-contained.
package = false
